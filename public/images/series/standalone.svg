<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2540"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="40%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(15,37,64,0)"/>
      <stop offset="100%" style="stop-color:rgba(15,37,64,0.9)"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Open Bible -->
  <g opacity="0.12" stroke="#c9a227" stroke-width="3" fill="none">
    <!-- Left page -->
    <path d="M400,120 Q300,100 200,120 L200,300 Q300,320 400,300"/>
    <!-- Right page -->
    <path d="M400,120 Q500,100 600,120 L600,300 Q500,320 400,300"/>
    <!-- Center spine -->
    <line x1="400" y1="120" x2="400" y2="300"/>
    
    <!-- Page lines left -->
    <line x1="230" y1="150" x2="370" y2="145"/>
    <line x1="230" y1="175" x2="370" y2="170"/>
    <line x1="230" y1="200" x2="370" y2="195"/>
    <line x1="230" y1="225" x2="370" y2="220"/>
    <line x1="230" y1="250" x2="370" y2="245"/>
    
    <!-- Page lines right -->
    <line x1="430" y1="145" x2="570" y2="150"/>
    <line x1="430" y1="170" x2="570" y2="175"/>
    <line x1="430" y1="195" x2="570" y2="200"/>
    <line x1="430" y1="220" x2="570" y2="225"/>
    <line x1="430" y1="245" x2="570" y2="250"/>
  </g>
  
  <!-- Decorative cross bookmark -->
  <g opacity="0.1" stroke="#c9a227" stroke-width="4" fill="none">
    <line x1="400" y1="80" x2="400" y2="140"/>
    <line x1="380" y1="105" x2="420" y2="105"/>
  </g>
  
  <rect width="800" height="450" fill="url(#overlay)"/>
  
  <line x1="60" y1="310" x2="740" y2="310" stroke="#c9a227" stroke-width="4"/>
  
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#faf8f5" text-anchor="middle">STAND-ALONE</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#c9a227" text-anchor="middle">MESSAGES</text>
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Victory Bible Baptist Church</text>
</svg>