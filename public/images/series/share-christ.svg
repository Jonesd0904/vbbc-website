<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2540"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="40%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(15,37,64,0)"/>
      <stop offset="100%" style="stop-color:rgba(15,37,64,0.9)"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Speech bubbles / Sharing -->
  <g opacity="0.12" stroke="#c9a227" stroke-width="2" fill="none">
    <ellipse cx="200" cy="150" rx="70" ry="45"/>
    <path d="M180,190 L150,230 L200,195"/>
    
    <ellipse cx="400" cy="120" rx="80" ry="50"/>
    <path d="M380,165 L350,210 L400,170"/>
    
    <ellipse cx="600" cy="160" rx="65" ry="40"/>
    <path d="M620,195 L650,235 L600,200"/>
  </g>
  
  <!-- People outlines reaching out -->
  <g opacity="0.1" stroke="#c9a227" stroke-width="3" fill="none">
    <circle cx="250" cy="280" r="20"/>
    <line x1="250" y1="300" x2="250" y2="360"/>
    <line x1="250" y1="320" x2="220" y2="300"/>
    <line x1="250" y1="320" x2="280" y2="300"/>
    
    <circle cx="400" cy="260" r="20"/>
    <line x1="400" y1="280" x2="400" y2="340"/>
    <line x1="400" y1="300" x2="360" y2="280"/>
    <line x1="400" y1="300" x2="440" y2="280"/>
    
    <circle cx="550" cy="285" r="20"/>
    <line x1="550" y1="305" x2="550" y2="365"/>
    <line x1="550" y1="325" x2="520" y2="305"/>
    <line x1="550" y1="325" x2="580" y2="305"/>
  </g>
  
  <rect width="800" height="450" fill="url(#overlay)"/>
  
  <line x1="60" y1="310" x2="740" y2="310" stroke="#c9a227" stroke-width="4"/>
  
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#faf8f5" text-anchor="middle">HOW TO</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#c9a227" text-anchor="middle">SHARE CHRIST</text>
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Victory Bible Baptist Church</text>
</svg>