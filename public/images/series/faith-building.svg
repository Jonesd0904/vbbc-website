<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2540"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="40%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(15,37,64,0)"/>
      <stop offset="100%" style="stop-color:rgba(15,37,64,0.9)"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Building Blocks Pattern -->
  <g opacity="0.12" stroke="#c9a227" stroke-width="2" fill="none">
    <rect x="100" y="350" width="80" height="40"/>
    <rect x="190" y="350" width="80" height="40"/>
    <rect x="280" y="350" width="80" height="40"/>
    <rect x="370" y="350" width="80" height="40"/>
    <rect x="460" y="350" width="80" height="40"/>
    <rect x="550" y="350" width="80" height="40"/>
    
    <rect x="145" y="305" width="80" height="40"/>
    <rect x="235" y="305" width="80" height="40"/>
    <rect x="325" y="305" width="80" height="40"/>
    <rect x="415" y="305" width="80" height="40"/>
    <rect x="505" y="305" width="80" height="40"/>
    
    <rect x="190" y="260" width="80" height="40"/>
    <rect x="280" y="260" width="80" height="40"/>
    <rect x="370" y="260" width="80" height="40"/>
    <rect x="460" y="260" width="80" height="40"/>
  </g>
  
  <!-- Upward arrow -->
  <g opacity="0.15" fill="#c9a227">
    <path d="M400,100 L350,180 L375,180 L375,250 L425,250 L425,180 L450,180 Z"/>
  </g>
  
  <rect width="800" height="450" fill="url(#overlay)"/>
  
  <line x1="60" y1="310" x2="740" y2="310" stroke="#c9a227" stroke-width="4"/>
  
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#faf8f5" text-anchor="middle">FAITH BUILDING</text>
  <text x="400" y="410" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#c9a227" text-anchor="middle">Growing Stronger in Faith</text>
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Victory Bible Baptist Church</text>
</svg>