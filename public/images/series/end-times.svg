<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2540"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="40%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(15,37,64,0)"/>
      <stop offset="100%" style="stop-color:rgba(15,37,64,0.9)"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Scroll/Prophecy symbols -->
  <g opacity="0.12" stroke="#c9a227" stroke-width="3" fill="none">
    <path d="M200,80 L300,80 Q320,150 300,220 L200,220 Q180,150 200,80"/>
    <path d="M350,120 L450,120 Q470,190 450,260 L350,260 Q330,190 350,120"/>
    <path d="M500,60 L600,60 Q620,150 600,240 L500,240 Q480,150 500,60"/>
  </g>
  
  <!-- Clock/Time symbol -->
  <g opacity="0.1" stroke="#c9a227" stroke-width="4" fill="none">
    <circle cx="400" cy="200" r="70"/>
    <line x1="400" y1="200" x2="400" y2="150"/>
    <line x1="400" y1="200" x2="440" y2="200"/>
  </g>
  
  <!-- Stars -->
  <g opacity="0.15" fill="#c9a227">
    <circle cx="150" cy="100" r="4"/>
    <circle cx="650" cy="80" r="3"/>
    <circle cx="700" cy="150" r="4"/>
    <circle cx="100" cy="200" r="3"/>
    <circle cx="720" cy="250" r="3"/>
  </g>
  
  <rect width="800" height="450" fill="url(#overlay)"/>
  
  <line x1="60" y1="310" x2="740" y2="310" stroke="#c9a227" stroke-width="4"/>
  
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#faf8f5" text-anchor="middle">END TIMES</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#c9a227" text-anchor="middle">PROPHECY</text>
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Victory Bible Baptist Church</text>
</svg>