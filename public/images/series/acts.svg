<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2540"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="40%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(15,37,64,0)"/>
      <stop offset="100%" style="stop-color:rgba(15,37,64,0.9)"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Flame/Fire Pattern (Pentecost) -->
  <g opacity="0.15" stroke="#c9a227" stroke-width="3" fill="none">
    <path d="M200,350 Q200,300 220,280 Q180,250 200,200 Q220,250 200,280 Q220,300 200,350"/>
    <path d="M320,350 Q320,280 350,250 Q300,200 330,140 Q360,200 320,250 Q340,280 320,350"/>
    <path d="M450,350 Q450,270 490,230 Q430,170 470,100 Q510,170 450,230 Q480,270 450,350"/>
    <path d="M580,350 Q580,280 610,250 Q560,200 590,140 Q620,200 580,250 Q600,280 580,350"/>
    <path d="M700,350 Q700,300 720,280 Q680,250 700,200 Q720,250 700,280 Q720,300 700,350"/>
  </g>
  
  <!-- Globe/World -->
  <g opacity="0.08" stroke="#c9a227" stroke-width="2" fill="none">
    <circle cx="400" cy="200" r="80"/>
    <ellipse cx="400" cy="200" rx="80" ry="30"/>
    <ellipse cx="400" cy="200" rx="30" ry="80"/>
  </g>
  
  <rect width="800" height="450" fill="url(#overlay)"/>
  
  <line x1="60" y1="310" x2="740" y2="310" stroke="#c9a227" stroke-width="4"/>
  
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#faf8f5" text-anchor="middle">ACTS OF THE</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#c9a227" text-anchor="middle">APOSTLES</text>
  <text x="760" y="40" font-family="Georgia, serif" font-size="20" fill="rgba(201,162,39,0.8)" text-anchor="end">Acts</text>
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Victory Bible Baptist Church</text>
</svg>