<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2540"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="40%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(15,37,64,0)"/>
      <stop offset="100%" style="stop-color:rgba(15,37,64,0.9)"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Bird/Freedom Pattern -->
  <g opacity="0.12" stroke="#c9a227" stroke-width="2" fill="none">
    <path d="M150,100 Q120,80 90,100 M150,100 Q180,80 210,100"/>
    <path d="M350,150 Q320,130 290,150 M350,150 Q380,130 410,150"/>
    <path d="M550,80 Q520,60 490,80 M550,80 Q580,60 610,80"/>
    <path d="M250,200 Q220,180 190,200 M250,200 Q280,180 310,200"/>
    <path d="M650,180 Q620,160 590,180 M650,180 Q680,160 710,180"/>
    <path d="M450,120 Q420,100 390,120 M450,120 Q480,100 510,120"/>
  </g>
  
  <!-- Broken chains symbol -->
  <g opacity="0.1" stroke="#c9a227" stroke-width="3" fill="none">
    <circle cx="300" cy="280" r="20"/>
    <circle cx="350" cy="280" r="20"/>
    <path d="M370,280 L430,280" stroke-dasharray="10,10"/>
    <circle cx="450" cy="280" r="20"/>
    <circle cx="500" cy="280" r="20"/>
  </g>
  
  <rect width="800" height="450" fill="url(#overlay)"/>
  
  <line x1="60" y1="310" x2="740" y2="310" stroke="#c9a227" stroke-width="4"/>
  
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#faf8f5" text-anchor="middle">GALATIANS</text>
  <text x="400" y="410" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#c9a227" text-anchor="middle">Freedom in Christ</text>
  <text x="760" y="40" font-family="Georgia, serif" font-size="20" fill="rgba(201,162,39,0.8)" text-anchor="end">Galatians</text>
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Victory Bible Baptist Church</text>
</svg>