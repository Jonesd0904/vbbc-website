<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2540"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="40%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(15,37,64,0)"/>
      <stop offset="100%" style="stop-color:rgba(15,37,64,0.9)"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Flowing Grace Pattern -->
  <g opacity="0.12" stroke="#c9a227" stroke-width="2" fill="none">
    <path d="M0,80 Q100,110 200,80 Q300,50 400,80 Q500,110 600,80 Q700,50 800,80"/>
    <path d="M0,150 Q100,180 200,150 Q300,120 400,150 Q500,180 600,150 Q700,120 800,150"/>
    <path d="M0,220 Q100,250 200,220 Q300,190 400,220 Q500,250 600,220 Q700,190 800,220"/>
  </g>
  
  <!-- Crown/Treasure symbol -->
  <g opacity="0.1" fill="#c9a227">
    <path d="M350,200 L370,160 L400,190 L430,160 L450,200 L350,200"/>
  </g>
  
  <rect width="800" height="450" fill="url(#overlay)"/>
  
  <line x1="60" y1="310" x2="740" y2="310" stroke="#c9a227" stroke-width="4"/>
  
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#faf8f5" text-anchor="middle">EPHESIANS</text>
  <text x="400" y="410" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#c9a227" text-anchor="middle">Riches of His Grace</text>
  <text x="760" y="40" font-family="Georgia, serif" font-size="20" fill="rgba(201,162,39,0.8)" text-anchor="end">Ephesians</text>
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">Victory Bible Baptist Church</text>
</svg>